name: release

# A tag like v1.2.3 builds everything and drafts a release with it. Run by
# hand, it builds everything and keeps it as the run's artifacts, which is
# how to try a change to the builds without releasing anything.
#
# The Mac builds are signed and notarised when the MACOS_CERT_P12,
# MACOS_CERT_PASSWORD, APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID
# secrets are set. Without them they're signed for this machine only, and
# macOS won't open them from a download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-{0}', github.sha) }}

jobs:
  # The command line for Linux and Windows, and the Windows app, which needs
  # no cgo, all build here.
  linux-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Build
        run: |
          V=${VERSION#v}
          FLAGS="-s -w -X main.version=$V"
          mkdir -p dist out
          for arch in amd64 arm64; do
            mkdir -p out/cli-linux-$arch
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$FLAGS" -o out/cli-linux-$arch/factory-pack ./cmd/factory-pack
            cp README.md LICENSE out/cli-linux-$arch/
            tar -C out/cli-linux-$arch -czf dist/factory-pack-linux-$arch.tar.gz .
          done
          mkdir -p out/cli-windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o out/cli-windows/factory-pack.exe ./cmd/factory-pack
          cp README.md LICENSE out/cli-windows/
          (cd out/cli-windows && zip -qr ../../dist/factory-pack-windows-amd64.zip .)
          (cd app && GOOS=windows GOARCH=amd64 go build -trimpath -tags production -ldflags "$FLAGS -H windowsgui" -o ../dist/FactoryPack-Windows.exe .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: dist/*

  # The Linux app with GTK and WebKitGTK inside, for desktops that haven't
  # got them, SteamOS and Bazzite among them. Built on the oldest Ubuntu it
  # supports, as an AppImage only starts on a glibc as new as the one it was
  # built on.
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: AppImage
        run: VERSION=${VERSION#v} bash app/build/linux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/FactoryPack-Linux.AppImage

  macos:
    runs-on: macos-latest
    env:
      SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Build for Apple silicon and Intel, as one
        run: |
          V=${VERSION#v}
          FLAGS="-s -w -X main.version=$V"
          APP="out/Factory Pack.app"
          mkdir -p out/cli "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for arch in arm64 amd64; do
            cc="clang -arch $([ $arch = amd64 ] && echo x86_64 || echo arm64)"
            CGO_ENABLED=1 GOARCH=$arch CC="$cc" go build -trimpath -ldflags "$FLAGS" -o out/factory-pack-$arch ./cmd/factory-pack
            (cd app && CGO_ENABLED=1 GOARCH=$arch CC="$cc" go build -trimpath -tags production -ldflags "$FLAGS" -o ../out/app-$arch .)
          done
          lipo -create -output out/cli/factory-pack out/factory-pack-arm64 out/factory-pack-amd64
          lipo -create -output "$APP/Contents/MacOS/Factory Pack" out/app-arm64 out/app-amd64
          sed "s/VERSION/$V/g" app/build/darwin/Info.plist > "$APP/Contents/Info.plist"
          cp app/build/darwin/icon.icns "$APP/Contents/Resources/icon.icns"
      - name: Sign for this machine only
        if: env.SIGNING != 'true'
        run: |
          codesign --force -s - out/cli/factory-pack
          codesign --force --deep -s - "out/Factory Pack.app"
      - name: Sign and notarise
        if: env.SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$IDENTITY"
          sign() { codesign --force --options runtime --timestamp --sign "$IDENTITY" "$1"; }
          sign out/cli/factory-pack
          sign "out/Factory Pack.app/Contents/MacOS/Factory Pack"
          sign "out/Factory Pack.app"
          for target in out/cli/factory-pack "out/Factory Pack.app"; do
            ditto -c -k --keepParent "$target" "$RUNNER_TEMP/notarise.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          done
          # A bare program can't carry its ticket; Gatekeeper looks it up
          # online the first time instead. An app can.
          xcrun stapler staple "out/Factory Pack.app"
      - name: Pack
        run: |
          mkdir -p dist
          cp README.md LICENSE out/cli/
          (cd out/cli && zip -qr ../../dist/factory-pack-macos.zip .)
          ditto -c -k --keepParent "out/Factory Pack.app" dist/FactoryPack-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-windows, macos, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      # Run again for the same tag, once the Mac builds can be signed say, it
      # puts the new files in place of the old.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "Factory Pack $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
